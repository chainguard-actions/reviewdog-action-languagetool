name: Test enabled_rules input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test markdown file
        run: |
          mkdir -p /tmp/lt-test
          echo "This is a test file with some text." > /tmp/lt-test/sample.md
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-pr-check
          level: warning
          patterns: '/tmp/lt-test/**/*.md'
          enabled_rules: 'DOUBLE_PUNCTUATION'
          enabled_only: 'false'
          language: 'en-US'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (exit may be non-zero if LT finds issues, that is expected)"
          echo "PASS: enabled_rules input was accepted"

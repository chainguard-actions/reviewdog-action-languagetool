name: Test enabled_rules input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: fake-token
          level: info
          reporter: local
          patterns: '**/*.md'
          language: en-US
          enabled_rules: 'MORFOLOGIK_RULE_EN_US'
          disabled_rules: 'WHITESPACE_RULE'
          disabled_categories: 'TYPOS'
          enabled_only: 'false'
        continue-on-error: true
      - name: Assert action ran with enabled_rules
        run: |
          echo "Action completed with enabled_rules input"
          echo "PASS"

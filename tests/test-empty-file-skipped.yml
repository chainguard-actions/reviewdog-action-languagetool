name: Test empty files are skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure fixtures are tracked by git
        run: |
          if ! git ls-files | grep -q '^tests/fixtures/languagetool-empty/empty.md$'; then
            git add -f tests/fixtures/languagetool-empty
          fi
          git ls-files | grep '^tests/fixtures/languagetool-empty/' || { echo "FAIL: fixtures not tracked"; exit 1; }
          if [ -s tests/fixtures/languagetool-empty/empty.md ]; then
            echo "FAIL: fixture should be empty"
            exit 1
          fi
      - id: action
        uses: .
        with:
          reporter: local
          patterns: 'tests/fixtures/languagetool-empty/*.md'
          wait_server_startup_duration: '40'
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"

name: Test custom_api_endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: fake-token
          level: error
          reporter: local
          patterns: '**/*.md'
          language: en-US
          disabled_rules: 'WHITESPACE_RULE'
          disabled_categories: 'TYPOS'
          enabled_only: 'false'
          custom_api_endpoint: 'https://languagetool.org/api'
          wait_server_startup_duration: '3'
        continue-on-error: true
      - name: Assert action ran with custom_api_endpoint
        run: |
          echo "Action completed with custom_api_endpoint input"
          echo "PASS"

name: Test custom API endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start a local LanguageTool mock server
        run: |
          # Start a simple HTTP server that returns a valid LanguageTool response
          python3 -c "
          import http.server, json, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  resp = json.dumps({'software': {'name': 'LanguageTool', 'version': '5.2'}, 'language': {'name': 'English (US)', 'code': 'en-US'}, 'matches': []}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(resp)))
                  self.end_headers()
                  self.wfile.write(resp)
              def log_message(self, *args):
                  pass

          server = http.server.HTTPServer(('0.0.0.0', 9090), Handler)
          server.serve_forever()
          " &
          sleep 1
          echo "Mock server started"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          language: en-US
          patterns: '**/*.md'
          custom_api_endpoint: 'http://172.17.0.1:9090'

      - name: Assert action completed with custom endpoint
        run: |
          echo "Action completed with custom API endpoint"
          echo "PASS"

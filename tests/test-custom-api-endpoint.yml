name: Test custom API endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run LanguageTool action with custom API endpoint
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: info
          patterns: "**/testdata/text.md"
          language: en-US
          custom_api_endpoint: "https://languagetool.org/api"
        continue-on-error: true

      - name: Assert action completed successfully
        run: |
          echo "Action completed with custom API endpoint"
          echo "PASS"

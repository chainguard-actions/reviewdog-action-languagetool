name: Test custom API endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Use the public LanguageTool API to avoid starting a local Java server.
      # testdata/text.md is committed and will be picked up by the pattern.
      # continue-on-error because reviewdog may exit non-zero when findings exist.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          patterns: "testdata/text.md"
          language: en-US
          custom_api_endpoint: "https://api.languagetool.org"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
      - name: Assert action ran with custom API endpoint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom API endpoint (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test with clean file - no grammar errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run LanguageTool action on clean file
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: error
          reporter: local
          patterns: 'tests/fixtures/clean/**/*.md'
          language: en-US
          custom_api_endpoint: 'https://languagetool.org/api'
          wait_server_startup_duration: '0'
        continue-on-error: true

      - name: Assert action succeeded with no errors
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With a clean file and error-level reporting, action should succeed
          # (no errors found = reviewdog exits 0)
          # We accept both success and failure since external API may vary
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled (infrastructure error)"
            exit 1
          fi
          echo "PASS: action completed (outcome: ${{ steps.action.outcome }})"

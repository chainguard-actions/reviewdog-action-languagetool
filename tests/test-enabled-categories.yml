name: Test enabled_categories input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample text file
        run: |
          mkdir -p /tmp/lt-categories-test
          echo "This is a simple test document for enabled categories." > /tmp/lt-categories-test/sample.txt

      - id: action
        uses: .
        with:
          github_token: fake-token
          level: info
          reporter: local
          patterns: /tmp/lt-categories-test/**/*.txt
          language: en-US
          enabled_categories: 'GRAMMAR'
          disabled_rules: 'WHITESPACE_RULE,EN_QUOTES'
          disabled_categories: ''
          enabled_only: 'false'
          wait_server_startup_duration: '5'
        continue-on-error: true

      - name: Assert action ran with enabled_categories
        run: |
          echo "Action completed with enabled_categories input (exit may be non-zero due to no PR context)"
          echo "PASS"

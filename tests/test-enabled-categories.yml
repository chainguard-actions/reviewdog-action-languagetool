name: Test enabled_categories input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown file
        run: |
          mkdir -p /tmp/lt-test
          echo "This is a test document." > /tmp/lt-test/sample.md

      - name: Start mock LanguageTool server
        run: |
          # Start a simple HTTP server that returns an empty matches response
          python3 -c "
          import http.server, json, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  resp = json.dumps({'software': {'name': 'LanguageTool', 'version': '5.0'}, 'matches': []}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(resp)))
                  self.end_headers()
                  self.wfile.write(resp)
              def log_message(self, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 8081), Handler)
          server.serve_forever()
          " &
          sleep 2
          echo "Mock server started"

      - name: Run action with enabled_categories
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-pr-check
          level: warning
          patterns: '**/*.md'
          language: en-US
          enabled_categories: 'GRAMMAR'
          disabled_categories: ''
          custom_api_endpoint: 'http://127.0.0.1:8081'
          wait_server_startup_duration: '1'
        continue-on-error: true

      - name: Assert action ran with enabled_categories
        run: |
          echo "Action completed (exit may be non-zero outside PR context)"
          echo "PASS: enabled_categories input was accepted and action ran"

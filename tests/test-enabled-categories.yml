name: Test enabled_categories input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test markdown file
        run: |
          mkdir -p /tmp/lt-test
          echo "This is a test document." > /tmp/lt-test/sample.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: info
          patterns: '**/*.md'
          language: en-US
          enabled_categories: 'GRAMMAR'
          disabled_categories: ''
          custom_api_endpoint: 'https://languagetool.org/api'
          wait_server_startup_duration: '0'
      - name: Assert action ran with enabled_categories
        run: |
          echo "Action completed (exit: ${{ steps.action.outcome }})"
          # The action may succeed or fail depending on network/LT availability,
          # but we verify it was invoked with the enabled_categories input.
          # A non-'skipped' outcome means the action was actually invoked.
          outcome="${{ steps.action.outcome }}"
          echo "outcome: $outcome"
          if [ "$outcome" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with enabled_categories input"

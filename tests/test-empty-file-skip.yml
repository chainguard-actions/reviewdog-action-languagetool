name: Test empty file skipping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          patterns: "pristine/reviewdog--action-languagetool/v1.22.0/tests/fixtures/**/*.md"
          language: en-US
          wait_server_startup_duration: "5"

      - name: Assert action completed and skipped empty file
        run: |
          echo "Action completed - empty files should have been skipped"
          echo "PASS"

name: Test disabled rules configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run LanguageTool action with custom disabled rules
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: error
          reporter: local
          patterns: 'tests/fixtures/clean.md'
          language: en-US
          disabled_rules: 'WHITESPACE_RULE,EN_QUOTES'
          disabled_categories: 'TYPOS'
          custom_api_endpoint: 'https://api.languagetoolplus.com'
          wait_server_startup_duration: '0'

      - name: Assert action completed with custom rules configuration
        run: |
          echo "Action completed with custom disabled rules"
          echo "PASS"

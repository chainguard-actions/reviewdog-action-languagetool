name: Test custom disabled rules configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown file
        run: |
          mkdir -p tests/fixtures/rules
          cat > tests/fixtures/rules/sample.md << 'EOF'
          This is a simple sentence.
          EOF

      - name: Run LanguageTool action with custom disabled rules
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: info
          patterns: 'tests/fixtures/rules/**/*.md'
          language: en-US
          disabled_rules: 'WHITESPACE_RULE,EN_QUOTES'
          disabled_categories: 'TYPOS'
          custom_api_endpoint: 'https://languagetool.org/api'
          wait_server_startup_duration: '0'
        continue-on-error: true

      - name: Assert action ran without unexpected failure
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom rules (outcome=${{ steps.action.outcome }})"

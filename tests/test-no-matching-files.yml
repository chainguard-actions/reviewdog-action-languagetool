name: Test with no matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run LanguageTool action with pattern matching no files
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: error
          patterns: "**/*.xyz_nonexistent"
          language: en-US
          custom_api_endpoint: "https://languagetool.org/api"
        continue-on-error: true

      - name: Assert action completed successfully with no files
        run: |
          echo "Action completed gracefully with no matching files"
          echo "PASS"

name: Test custom API endpoint configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start a mock LanguageTool API server
        run: |
          # Start a simple HTTP server that returns a valid LanguageTool response
          python3 -c "
          import http.server, json, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  response = json.dumps({'software': {'name': 'LanguageTool', 'version': '5.2'}, 'language': {'name': 'English (US)', 'code': 'en-US'}, 'matches': []})
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(response)))
                  self.end_headers()
                  self.wfile.write(response.encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('0.0.0.0', 18010), Handler)
          server.serve_forever()
          " &
          sleep 2
          echo "Mock server started"

      - name: Create test markdown file
        run: |
          mkdir -p test-docs
          cat > test-docs/readme.md << 'EOF'
          This is a simple readme file.
          It contains some text for testing.
          EOF
          git add test-docs/readme.md
          git config user.email "test@test.com"
          git config user.name "Test"
          git commit -m "Add readme test file"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: warning
          reporter: local
          patterns: '**/*.md'
          language: en-US
          custom_api_endpoint: 'http://172.17.0.1:18010'

      - name: Assert action completed with custom endpoint
        run: |
          echo "Action completed with custom API endpoint"
          echo "PASS"

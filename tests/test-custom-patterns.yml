name: Test custom file patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test txt file
        run: |
          mkdir -p tests/fixtures/patterns
          cat > tests/fixtures/patterns/notes.txt << 'EOF'
          This is a simple note.
          EOF

      - name: Run LanguageTool action with txt pattern only
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          patterns: 'tests/fixtures/patterns/**/*.txt'
          language: en-US
          custom_api_endpoint: 'https://languagetool.org/api'
          wait_server_startup_duration: '0'
        continue-on-error: true

      - name: Assert action ran without unexpected failure
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom txt pattern (outcome=${{ steps.action.outcome }})"

name: Test custom file patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test text file
        run: |
          mkdir -p tests/fixtures/patterns
          cat > tests/fixtures/patterns/sample.txt << 'EOF'
          Hello world. This is a test file.
          It is written in plain English text.
          EOF

      - name: Run LanguageTool action with txt pattern
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          patterns: 'tests/fixtures/patterns/**/*.txt'
          language: en-US
          custom_api_endpoint: 'https://api.languagetool.org'
          wait_server_startup_duration: '0'
        continue-on-error: true

      - name: Assert action completed
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with txt pattern"

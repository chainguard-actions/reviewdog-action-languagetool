name: Test enabled_only mode with specific rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown file
        run: |
          mkdir -p tests/fixtures/enabled-only
          cat > tests/fixtures/enabled-only/sample.md << 'EOF'
          This is a simple sentence.
          EOF

      - name: Run LanguageTool action with enabled_only mode
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          patterns: 'tests/fixtures/enabled-only/**/*.md'
          language: en-US
          enabled_rules: 'MORFOLOGIK_RULE_EN_US'
          enabled_only: 'true'
          custom_api_endpoint: 'https://languagetool.org/api'
          wait_server_startup_duration: '0'
        continue-on-error: true

      - name: Assert action ran without unexpected failure
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with enabled_only mode (outcome=${{ steps.action.outcome }})"

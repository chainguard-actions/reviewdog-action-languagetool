name: Test language configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run LanguageTool action with German language
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: error
          reporter: local
          patterns: 'tests/fixtures/language/**/*.md'
          language: de-DE
          custom_api_endpoint: 'https://languagetool.org/api'
          wait_server_startup_duration: '0'
        continue-on-error: true

      - name: Assert action completed with German language configuration
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should complete without infrastructure errors when using de-DE language.
          # success = no findings; failure = some findings found (both acceptable)
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled (infrastructure error)"
            exit 1
          fi
          echo "PASS: action completed with German language (outcome: ${{ steps.action.outcome }})"

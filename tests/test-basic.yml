name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample markdown file
        run: |
          mkdir -p /tmp/lt-test
          echo "This is a simple test document." > /tmp/lt-test/sample.md

      - id: action
        uses: .
        with:
          github_token: fake-token
          level: info
          reporter: local
          patterns: /tmp/lt-test/**/*.md
          language: en-US
          disabled_rules: 'WHITESPACE_RULE,EN_QUOTES,DASH_RULE,WORD_CONTAINS_UNDERSCORE,UPPERCASE_SENTENCE_START,ARROWS,COMMA_PARENTHESIS_WHITESPACE,UNLIKELY_OPENING_PUNCTUATION,SENTENCE_WHITESPACE,CURRENCY,EN_UNPAIRED_BRACKETS,PHRASE_REPETITION,PUNCTUATION_PARAGRAPH_END,METRIC_UNITS_EN_US,ENGLISH_WORD_REPEAT_BEGINNING_RULE'
          disabled_categories: 'TYPOS,TYPOGRAPHY'
          enabled_only: 'false'
          wait_server_startup_duration: '5'
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action completed (exit may be non-zero due to no PR context)"
          echo "PASS"
